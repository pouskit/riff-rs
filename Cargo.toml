[workspace]
resolver = "3"
members = ["crates/riff-core", "crates/riff-audio", "crates/riff-app", "crates/riff-plugins"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
version = "1.0.0"

[workspace.lints.clippy]

# Debug réduit : les fichiers .pdb complets (environ 700 Mo par exécutable) dominaient le temps d'édition de liens.
# Les numéros de ligne restent dans les paniques et les traces ; les dépendances n'ont aucune info de debug.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1

# Binaires de test et de mesure locaux : `lto = "fat"` reste réservé aux releases publiées.
[profile.release-local]
inherits = "release"
lto = "thin"
codegen-units = 16
